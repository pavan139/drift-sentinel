[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-sentinel"
version = "0.1.0"
description = "Sequential drift monitoring with delayed-label joins and alpha-spending alerts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
drift-sentinel = "drift_sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
